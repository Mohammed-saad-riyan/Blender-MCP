name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source
        run: python -m py_compile blender_mcp.py benchmarks/concurrent_requests.py tests/test_source_invariants.py
      - name: Run source-level tests
        run: python -m unittest discover -s tests -v